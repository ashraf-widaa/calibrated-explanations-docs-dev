<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 790" role="img" aria-labelledby="ce-fig-title ce-fig-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="ce-fig-title">Where Calibrated Explanations fits in a machine-learning workflow</title>
  <desc id="ce-fig-desc">Labelled data is split into a training set, a calibration set and a test set. The training set trains the model, or an existing trained model is used. Calibrated Explanations takes the trained model and the calibration set: it calibrates the model's outputs with Venn-Abers predictors for classification or conformal predictive systems for regression, and explains predictions with factual and alternative explanations. It produces calibrated predictions with a lower and an upper value, and explanations made of rules, weights and their ranges. These are interpreted and evaluated on the test set.</desc>
  <defs>
    <marker id="ce-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- card background so the figure reads in light and dark themes -->
  <rect x="1" y="1" width="638" height="788" rx="16" fill="#ffffff" stroke="#d6dbe4"/>

  <!-- labelled data -->
  <rect x="210" y="22" width="220" height="50" rx="10" fill="#eef1f6" stroke="#94a3b8"/>
  <text x="320" y="53" text-anchor="middle" font-size="18" font-weight="600" fill="#1f2937">Labelled data</text>

  <!-- three data sets -->
  <rect x="20" y="112" width="180" height="60" rx="10" fill="#eef1f6" stroke="#94a3b8"/>
  <text x="110" y="138" text-anchor="middle" font-size="17" font-weight="600" fill="#1f2937">Training set</text>
  <text x="110" y="160" text-anchor="middle" font-size="15" fill="#334155">fits the model</text>

  <rect x="230" y="112" width="180" height="60" rx="10" fill="#efe9ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="320" y="138" text-anchor="middle" font-size="17" font-weight="600" fill="#2e1065">Calibration set</text>
  <text x="320" y="160" text-anchor="middle" font-size="15" fill="#4c1d95">never used for training</text>

  <rect x="440" y="112" width="180" height="60" rx="10" fill="#eef1f6" stroke="#94a3b8"/>
  <text x="530" y="138" text-anchor="middle" font-size="17" font-weight="600" fill="#1f2937">Test set</text>
  <text x="530" y="160" text-anchor="middle" font-size="15" fill="#334155">final check</text>

  <path d="M320,72 L110,112" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#ce-arrow)"/>
  <path d="M320,72 L320,112" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#ce-arrow)"/>
  <path d="M320,72 L530,112" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#ce-arrow)"/>

  <!-- train the model -->
  <rect x="20" y="210" width="180" height="60" rx="10" fill="#eef1f6" stroke="#94a3b8"/>
  <text x="110" y="236" text-anchor="middle" font-size="17" font-weight="600" fill="#1f2937">Train the model</text>
  <text x="110" y="258" text-anchor="middle" font-size="15" fill="#334155">or use a trained one</text>
  <path d="M110,172 L110,210" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#ce-arrow)"/>

  <!-- CE block -->
  <rect x="12" y="306" width="590" height="330" rx="16" fill="#faf7ff" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="8 5"/>
  <text x="588" y="332" text-anchor="end" font-size="17" font-weight="700" fill="#5b21b6">Calibrated Explanations (CE)</text>

  <rect x="30" y="350" width="260" height="96" rx="10" fill="#efe9ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="160" y="377" text-anchor="middle" font-size="17" font-weight="700" fill="#2e1065">Calibrate</text>
  <text x="160" y="401" text-anchor="middle" font-size="15" fill="#4c1d95">Venn-Abers (classification)</text>
  <text x="160" y="421" text-anchor="middle" font-size="15" fill="#4c1d95">conformal predictive systems</text>
  <text x="160" y="440" text-anchor="middle" font-size="15" fill="#4c1d95">(regression)</text>

  <rect x="324" y="350" width="260" height="96" rx="10" fill="#efe9ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="454" y="377" text-anchor="middle" font-size="17" font-weight="700" fill="#2e1065">Explain</text>
  <text x="454" y="401" text-anchor="middle" font-size="15" fill="#4c1d95">factual explanations</text>
  <text x="454" y="423" text-anchor="middle" font-size="15" fill="#4c1d95">alternative explanations</text>
  <path d="M290,398 L324,398" stroke="#7c3aed" stroke-width="2" fill="none" marker-end="url(#ce-arrow)"/>

  <!-- inputs into CE -->
  <path d="M110,270 L110,350" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#ce-arrow)"/>
  <path d="M300,172 L230,350" stroke="#7c3aed" stroke-width="2" fill="none" marker-end="url(#ce-arrow)"/>

  <!-- outputs -->
  <rect x="30" y="510" width="260" height="96" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="160" y="540" text-anchor="middle" font-size="16" font-weight="700" fill="#2e1065">Calibrated prediction</text>
  <text x="160" y="564" text-anchor="middle" font-size="15" fill="#4c1d95">probability or interval,</text>
  <text x="160" y="586" text-anchor="middle" font-size="15" fill="#4c1d95">with a lower and upper value</text>

  <rect x="324" y="510" width="260" height="96" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="454" y="540" text-anchor="middle" font-size="16" font-weight="700" fill="#2e1065">Explanation</text>
  <text x="454" y="564" text-anchor="middle" font-size="15" fill="#4c1d95">rules and weights,</text>
  <text x="454" y="586" text-anchor="middle" font-size="15" fill="#4c1d95">each with a range</text>

  <path d="M160,446 L160,510" stroke="#7c3aed" stroke-width="2" fill="none" marker-end="url(#ce-arrow)"/>
  <path d="M454,446 L454,510" stroke="#7c3aed" stroke-width="2" fill="none" marker-end="url(#ce-arrow)"/>

  <!-- interpret and evaluate -->
  <rect x="170" y="670" width="300" height="60" rx="10" fill="#eef1f6" stroke="#94a3b8"/>
  <text x="320" y="696" text-anchor="middle" font-size="17" font-weight="600" fill="#1f2937">Interpret and evaluate</text>
  <text x="320" y="718" text-anchor="middle" font-size="15" fill="#334155">on the test set</text>
  <path d="M160,606 L250,670" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#ce-arrow)"/>
  <path d="M454,606 L390,670" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#ce-arrow)"/>
  <path d="M620,142 L626,142 L626,700 L470,700" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#ce-arrow)"/>

  <!-- legend -->
  <rect x="24" y="750" width="18" height="18" rx="4" fill="#eef1f6" stroke="#94a3b8"/>
  <text x="50" y="764" font-size="15" fill="#334155">conventional ML step</text>
  <rect x="220" y="750" width="18" height="18" rx="4" fill="#efe9ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="246" y="764" font-size="15" fill="#334155">added by CE</text>
</svg>
