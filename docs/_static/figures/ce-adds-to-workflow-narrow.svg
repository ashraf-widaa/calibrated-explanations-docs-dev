<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 770" role="img" aria-labelledby="ce-wn-title ce-wn-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="ce-wn-title">What CE adds to a supervised prediction workflow</title>
  <desc id="ce-wn-desc">Top, in blue, supervised prediction: the training set is used to fit a model, and the model predicts for a new case; this example baseline returns one value without uncertainty. Below, in orange, the workflow with CE: CE takes the same fitted model and a separate labelled calibration set, held out from training, calibrates, and predicts the same new case. It returns a calibrated prediction with its uncertainty, shown as probability bounds on a 0 to 1 scale for classification or as a prediction interval in the target's units for regression, and then factual and alternative explanations.</desc>
  <defs>
    <marker id="wn-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="wn-arrow-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="360" height="770" rx="14" fill="#ffffff"/>

  <!-- Lane 1 -->
  <text x="16" y="26" font-size="16" font-weight="700" fill="#1e3a8a">1 · Supervised prediction</text>
  <rect x="16" y="38" width="155" height="62" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="93" y="64" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">Training set</text>
  <text x="93" y="86" text-anchor="middle" font-size="12" fill="#1e40af">labelled data</text>
  <rect x="189" y="38" width="155" height="62" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="266" y="64" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">Fit a model</text>
  <text x="266" y="86" text-anchor="middle" font-size="12" fill="#1e40af">learn features → target</text>
  <path d="M171,69 H187" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#wn-arrow)"/>
  <rect x="189" y="124" width="155" height="62" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="266" y="150" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">Predict</text>
  <text x="266" y="172" text-anchor="middle" font-size="12" fill="#1e40af">for the new case</text>
  <path d="M266,100 V122" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#wn-arrow)"/>
  <rect x="16" y="124" width="155" height="62" rx="10" fill="#f8fafc" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="93" y="148" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">Example baseline:</text>
  <text x="93" y="168" text-anchor="middle" font-size="12" fill="#1e40af">one value, no uncertainty</text>
  <path d="M189,155 H173" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#wn-arrow)"/>

  <!-- Shared model and new case -->
  <rect x="16" y="214" width="155" height="48" rx="24" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="93" y="235" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">New case</text>
  <text x="93" y="252" text-anchor="middle" font-size="11" fill="#334155">target unknown</text>
  <path d="M171,226 C200,226 230,210 250,188" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#wn-arrow)"/>
  <text x="340" y="228" text-anchor="end" font-size="12" font-style="italic" fill="#334155">same fitted model,</text>
  <text x="340" y="244" text-anchor="end" font-size="12" font-style="italic" fill="#334155">unchanged</text>

  <!-- Lane 2 -->
  <text x="16" y="290" font-size="16" font-weight="700" fill="#7c2d12">2 · Workflow with CE</text>
  <rect x="16" y="302" width="155" height="76" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.5"/>
  <text x="93" y="326" text-anchor="middle" font-size="15" font-weight="700" fill="#7c2d12">Calibration set</text>
  <text x="93" y="346" text-anchor="middle" font-size="12" fill="#9a3412">separate labelled data,</text>
  <text x="93" y="363" text-anchor="middle" font-size="12" fill="#9a3412">never used for fitting</text>
  <rect x="189" y="302" width="155" height="76" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.5"/>
  <text x="266" y="328" text-anchor="middle" font-size="15" font-weight="700" fill="#7c2d12">Calibrate</text>
  <text x="266" y="349" text-anchor="middle" font-size="12" fill="#9a3412">CE wraps the</text>
  <text x="266" y="365" text-anchor="middle" font-size="12" fill="#9a3412">fitted model</text>
  <path d="M171,340 H187" stroke="#ea580c" stroke-width="2.5" fill="none" marker-end="url(#wn-arrow-o)"/>
  <path d="M344,69 H354 V340 H346" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#wn-arrow)"/>
  <rect x="16" y="402" width="328" height="58" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.5"/>
  <text x="180" y="426" text-anchor="middle" font-size="15" font-weight="700" fill="#7c2d12">Predict the same new case</text>
  <text x="180" y="446" text-anchor="middle" font-size="12" fill="#9a3412">with uncertainty</text>
  <path d="M266,378 V400" stroke="#ea580c" stroke-width="2.5" fill="none" marker-end="url(#wn-arrow-o)"/>
  <path d="M16,238 H6 V431 H14" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#wn-arrow)"/>

  <rect x="16" y="484" width="328" height="150" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.5"/>
  <text x="180" y="508" text-anchor="middle" font-size="15" font-weight="700" fill="#7c2d12">Calibrated prediction + uncertainty</text>
  <path d="M180,460 V482" stroke="#ea580c" stroke-width="2.5" fill="none" marker-end="url(#wn-arrow-o)"/>
  <text x="95" y="534" text-anchor="middle" font-size="12" font-weight="700" fill="#7c2d12">Classification</text>
  <line x1="36" y1="562" x2="156" y2="562" stroke="#475569" stroke-width="2"/>
  <line x1="36" y1="556" x2="36" y2="568" stroke="#475569" stroke-width="2"/>
  <line x1="156" y1="556" x2="156" y2="568" stroke="#475569" stroke-width="2"/>
  <text x="36" y="584" text-anchor="middle" font-size="11" fill="#334155">0</text>
  <text x="156" y="584" text-anchor="middle" font-size="11" fill="#334155">1</text>
  <rect x="86" y="554" width="22" height="16" fill="#fdba74" stroke="#c2410c" stroke-width="1.5"/>
  <line x1="97" y1="550" x2="97" y2="574" stroke="#7c2d12" stroke-width="3"/>
  <text x="95" y="612" text-anchor="middle" font-size="12" fill="#7c2d12">probability bounds</text>
  <text x="265" y="534" text-anchor="middle" font-size="12" font-weight="700" fill="#7c2d12">Regression</text>
  <line x1="200" y1="562" x2="330" y2="562" stroke="#475569" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="222" y1="562" x2="308" y2="562" stroke="#c2410c" stroke-width="3"/>
  <line x1="222" y1="553" x2="222" y2="571" stroke="#c2410c" stroke-width="3"/>
  <line x1="308" y1="553" x2="308" y2="571" stroke="#c2410c" stroke-width="3"/>
  <circle cx="258" cy="562" r="5" fill="#7c2d12"/>
  <text x="222" y="586" text-anchor="middle" font-size="11" fill="#334155">low</text>
  <text x="308" y="586" text-anchor="middle" font-size="11" fill="#334155">high</text>
  <text x="265" y="612" text-anchor="middle" font-size="12" fill="#7c2d12">interval, target units</text>

  <path d="M180,634 V656" stroke="#ea580c" stroke-width="2.5" fill="none" marker-end="url(#wn-arrow-o)"/>
  <rect x="16" y="658" width="328" height="96" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.5"/>
  <text x="180" y="686" text-anchor="middle" font-size="15" font-weight="700" fill="#7c2d12">Factual and alternative</text>
  <text x="180" y="706" text-anchor="middle" font-size="15" font-weight="700" fill="#7c2d12">explanations</text>
  <text x="180" y="730" text-anchor="middle" font-size="12" fill="#9a3412">Why this prediction?</text>
  <text x="180" y="746" text-anchor="middle" font-size="12" fill="#9a3412">What if one condition differed?</text>
</svg>
