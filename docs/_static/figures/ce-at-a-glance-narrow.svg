<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 452" role="img" aria-labelledby="ce-gn-title ce-gn-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="ce-gn-title">Calibrated Explanations at a glance</title>
  <desc id="ce-gn-desc">Left column, in blue, a conventional workflow: labelled data, train a model, predict a label or a score. Right column, in orange, what CE adds: part of the labelled data is held out as a calibration set; CE uses it to calibrate the trained model's outputs (the model itself is unchanged), explains its predictions, and returns a calibrated prediction and an explanation, each with a range.</desc>
  <defs>
    <marker id="gn-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c8796"/>
    </marker>
    <marker id="gn-arrow-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/>
    </marker>
  </defs>

  <!-- conventional column -->
  <rect x="6" y="8" width="160" height="62" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="86" y="44" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">Labelled data</text>
  <rect x="6" y="104" width="160" height="62" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="86" y="140" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">Train a model</text>
  <rect x="6" y="200" width="160" height="62" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="86" y="226" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">Predict</text>
  <text x="86" y="247" text-anchor="middle" font-size="14" fill="#1e40af">a label or a score</text>
  <path d="M86,70 V102" stroke="#7c8796" stroke-width="2" fill="none" marker-end="url(#gn-arrow)"/>
  <path d="M86,166 V198" stroke="#7c8796" stroke-width="2" fill="none" marker-end="url(#gn-arrow)"/>

  <!-- CE column -->
  <rect x="194" y="8" width="160" height="62" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.5"/>
  <text x="274" y="34" text-anchor="middle" font-size="16" font-weight="700" fill="#7c2d12">Calibration set</text>
  <text x="274" y="55" text-anchor="middle" font-size="14" fill="#9a3412">held out from training</text>
  <rect x="194" y="104" width="160" height="62" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.5"/>
  <text x="274" y="130" text-anchor="middle" font-size="16" font-weight="700" fill="#7c2d12">Calibrate</text>
  <text x="274" y="151" text-anchor="middle" font-size="14" fill="#9a3412">the model's outputs</text>
  <rect x="194" y="200" width="160" height="62" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.5"/>
  <text x="274" y="226" text-anchor="middle" font-size="16" font-weight="700" fill="#7c2d12">Explain</text>
  <text x="274" y="247" text-anchor="middle" font-size="14" fill="#9a3412">each prediction</text>
  <rect x="194" y="296" width="160" height="88" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.5"/>
  <text x="274" y="324" text-anchor="middle" font-size="16" font-weight="700" fill="#7c2d12">Prediction and</text>
  <text x="274" y="344" text-anchor="middle" font-size="16" font-weight="700" fill="#7c2d12">explanation,</text>
  <text x="274" y="366" text-anchor="middle" font-size="14" fill="#9a3412">each with a range</text>
  <path d="M274,70 V102" stroke="#ea580c" stroke-width="2" fill="none" marker-end="url(#gn-arrow-o)"/>
  <path d="M274,166 V198" stroke="#ea580c" stroke-width="2" fill="none" marker-end="url(#gn-arrow-o)"/>
  <path d="M274,262 V294" stroke="#ea580c" stroke-width="2" fill="none" marker-end="url(#gn-arrow-o)"/>

  <!-- links between columns -->
  <path d="M166,39 H192" stroke="#7c8796" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#gn-arrow)"/>
  <path d="M166,135 H192" stroke="#7c8796" stroke-width="2" fill="none" marker-end="url(#gn-arrow)"/>

  <!-- legend -->
  <rect x="6" y="400" width="226" height="24" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="119" y="417" text-anchor="middle" font-size="13" fill="#1e3a8a">blue: conventional ML step</text>
  <rect x="6" y="428" width="170" height="22" rx="11" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="91" y="444" text-anchor="middle" font-size="13" fill="#7c2d12">orange: added by CE</text>
</svg>
