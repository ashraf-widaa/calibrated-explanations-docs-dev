<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" role="img" aria-labelledby="ce-w-title ce-w-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="ce-w-title">What CE adds to supervised machine learning</title>
  <desc id="ce-w-desc">Top row, supervised machine learning, in blue: training data is used to train an ML model, which becomes a fitted predictive model; given an instance it returns a prediction. Bottom row, Calibrated Explanations, in orange: CE uses the same fitted model, without retraining it, together with separate labelled calibration data and the instance being explained. It returns four things: the prediction, task-specific uncertainty information (probability bounds for classification and threshold events, or a prediction interval in the target's units for interval regression), a factual explanation and alternative explanations.</desc>
  <defs>
    <marker id="w-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="w-arrow-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="920" height="470" rx="14" fill="#ffffff"/>

  <!-- Row 1: supervised machine learning -->
  <text x="20" y="30" font-size="17" font-weight="700" fill="#1e3a8a">Supervised machine learning</text>
  <rect x="20" y="44" width="150" height="66" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="95" y="72" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">Training data</text>
  <text x="95" y="94" text-anchor="middle" font-size="14" fill="#1e40af">labelled</text>
  <rect x="210" y="44" width="150" height="66" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="285" y="82" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">Train ML model</text>
  <rect x="400" y="44" width="160" height="66" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="480" y="72" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">Fitted model</text>
  <text x="480" y="94" text-anchor="middle" font-size="14" fill="#1e40af">predictive model</text>
  <rect x="600" y="44" width="300" height="66" rx="10" fill="#f8fafc" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="750" y="72" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">Prediction</text>
  <text x="750" y="94" text-anchor="middle" font-size="14" fill="#1e40af">a class or a value for the instance</text>
  <path d="M170,77 H208" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#w-arrow)"/>
  <path d="M360,77 H398" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#w-arrow)"/>
  <path d="M560,77 H598" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#w-arrow)"/>

  <!-- Instance being explained -->
  <rect x="210" y="150" width="150" height="54" rx="27" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="285" y="173" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Instance</text>
  <text x="285" y="192" text-anchor="middle" font-size="13" fill="#334155">to predict and explain</text>
  <path d="M340,152 L420,112" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#w-arrow)"/>
  <path d="M340,202 L420,262" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#w-arrow)"/>

  <!-- Same fitted model into CE -->
  <path d="M480,110 V258" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#w-arrow)"/>
  <text x="470" y="176" text-anchor="end" font-size="13" font-style="italic" fill="#334155">same fitted model,</text>
  <text x="470" y="193" text-anchor="end" font-size="13" font-style="italic" fill="#334155">not retrained</text>

  <!-- Row 2: Calibrated Explanations -->
  <text x="20" y="244" font-size="17" font-weight="700" fill="#7c2d12">With Calibrated Explanations</text>
  <rect x="20" y="262" width="190" height="86" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="115" y="290" text-anchor="middle" font-size="16" font-weight="700" fill="#7c2d12">Calibration data</text>
  <text x="115" y="312" text-anchor="middle" font-size="13" fill="#9a3412">separate and labelled,</text>
  <text x="115" y="330" text-anchor="middle" font-size="13" fill="#9a3412">not used for training</text>
  <path d="M210,305 H398" stroke="#ea580c" stroke-width="2.5" fill="none" marker-end="url(#w-arrow-o)"/>
  <rect x="400" y="262" width="160" height="86" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.5"/>
  <text x="480" y="298" text-anchor="middle" font-size="17" font-weight="700" fill="#7c2d12">CE</text>
  <text x="480" y="320" text-anchor="middle" font-size="13" fill="#9a3412">calibrates and</text>
  <text x="480" y="337" text-anchor="middle" font-size="13" fill="#9a3412">explains</text>

  <!-- Four outputs -->
  <path d="M560,305 H582" stroke="#ea580c" stroke-width="2.5" fill="none"/>
  <path d="M582,170 V412" stroke="#ea580c" stroke-width="2.5" fill="none"/>
  <path d="M582,170 H598" stroke="#ea580c" stroke-width="2.5" fill="none" marker-end="url(#w-arrow-o)"/>
  <path d="M582,240 H598" stroke="#ea580c" stroke-width="2.5" fill="none" marker-end="url(#w-arrow-o)"/>
  <path d="M582,342 H598" stroke="#ea580c" stroke-width="2.5" fill="none" marker-end="url(#w-arrow-o)"/>
  <path d="M582,412 H598" stroke="#ea580c" stroke-width="2.5" fill="none" marker-end="url(#w-arrow-o)"/>

  <rect x="600" y="146" width="300" height="48" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="616" y="176" font-size="15" font-weight="700" fill="#7c2d12">1 · Prediction</text>

  <rect x="600" y="204" width="300" height="114" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="616" y="228" font-size="15" font-weight="700" fill="#7c2d12">2 · Uncertainty, by task</text>
  <!-- probability bounds -->
  <line x1="620" y1="262" x2="740" y2="262" stroke="#475569" stroke-width="2"/>
  <line x1="620" y1="256" x2="620" y2="268" stroke="#475569" stroke-width="2"/>
  <line x1="740" y1="256" x2="740" y2="268" stroke="#475569" stroke-width="2"/>
  <text x="620" y="284" text-anchor="middle" font-size="12" fill="#334155">0</text>
  <text x="740" y="284" text-anchor="middle" font-size="12" fill="#334155">1</text>
  <rect x="682" y="254" width="22" height="16" fill="#fdba74" stroke="#c2410c" stroke-width="1.5"/>
  <line x1="693" y1="250" x2="693" y2="274" stroke="#7c2d12" stroke-width="3"/>
  <text x="680" y="306" text-anchor="middle" font-size="13" fill="#7c2d12">probability bounds</text>
  <!-- prediction interval -->
  <line x1="770" y1="262" x2="890" y2="262" stroke="#475569" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="790" y1="262" x2="870" y2="262" stroke="#c2410c" stroke-width="3"/>
  <line x1="790" y1="253" x2="790" y2="271" stroke="#c2410c" stroke-width="3"/>
  <line x1="870" y1="253" x2="870" y2="271" stroke="#c2410c" stroke-width="3"/>
  <circle cx="822" cy="262" r="5" fill="#7c2d12"/>
  <text x="830" y="306" text-anchor="middle" font-size="13" fill="#7c2d12">interval, target units</text>

  <rect x="600" y="326" width="300" height="34" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="616" y="349" font-size="15" font-weight="700" fill="#7c2d12">3 · Factual explanation</text>
  <text x="884" y="349" text-anchor="end" font-size="13" fill="#9a3412">why?</text>
  <rect x="600" y="396" width="300" height="34" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="616" y="419" font-size="15" font-weight="700" fill="#7c2d12">4 · Alternative explanations</text>
  <text x="884" y="419" text-anchor="end" font-size="13" fill="#9a3412">what if?</text>
  <text x="600" y="382" font-size="12" fill="#9a3412">each explanation reports ranges for its weights</text>

  <text x="20" y="430" font-size="13" fill="#475569">CE does not retrain the model. Uncertainty depends on the task and</text>
  <text x="20" y="448" font-size="13" fill="#475569">its assumptions; it is not a guarantee for an individual case.</text>
</svg>
